<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title>Beds | CareAxis</title></head><body class="app"><div th:replace="~{fragments :: sidebar}"></div><main class="app-main"><div th:replace="~{fragments :: topbar}"></div><section class="content"><p class="eyebrow">CAPACITY MANAGEMENT</p><h1>Bed management</h1><p>Current allocation and ward capacity in real time.</p><div class="bed-grid"><article th:each="bed:${beds}" th:classappend="${bed.status == 'Occupied'} ? ' occupied' : ''"><strong th:text="${bed.bedNumber}"></strong><span th:text="${bed.ward}"></span><small th:text="${bed.category}"></small><b th:text="${bed.status}"></b></article></div></section></main></body></html>
