<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title>Register patient | CareAxis</title></head><body class="app"><div th:replace="~{fragments :: sidebar}"></div><main class="app-main"><div th:replace="~{fragments :: topbar}"></div><section class="content narrow"><p class="eyebrow">PATIENT MANAGEMENT</p><h1>Register a new patient</h1><p>Enter verified information to create a clinical patient record.</p><form th:action="@{/patients}" th:object="${patient}" method="post" class="card patient-form"><div class="form-grid"><label>Full name<input th:field="*{fullName}" required><small th:errors="*{fullName}"></small></label><label>Date of birth<input type="date" th:field="*{dateOfBirth}" required></label><label>Gender<select th:field="*{gender}" required><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></label><label>Mobile number<input th:field="*{phone}" required><small th:errors="*{phone}"></small></label><label>Blood group<select th:field="*{bloodGroup}"><option>Unknown</option><option>A+</option><option>B+</option><option>O+</option><option>AB+</option></select></label><label>Department<select th:field="*{department}"><option>General Medicine</option><option>Cardiology</option><option>Neurology</option><option>Orthopedics</option></select></label><label>Patient status<select th:field="*{status}"><option>Outpatient</option><option>Admitted</option><option>Emergency</option></select></label><label>Primary diagnosis<input th:field="*{diagnosis}" placeholder="Presenting concern"></label></div><div class="form-actions"><a href="/patients">Cancel</a><button class="btn btn-primary">Create patient record</button></div></form></section></main></body></html>
