<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><title>Patients | CareAxis</title></head><body class="app"><div th:replace="~{fragments :: sidebar}"></div><main class="app-main"><div th:replace="~{fragments :: topbar}"></div><section class="content"><div class="heading"><div><p class="eyebrow">CLINICAL OPERATIONS</p><h1>Patient directory</h1><p>Manage patient records, care status, and clinical information.</p></div><a class="btn btn-primary" href="/patients/new"><i class="fa-solid fa-plus"></i> Register patient</a></div><div class="card table-card"><form class="filter"><i class="fa-solid fa-magnifying-glass"></i><input name="q" th:value="${q}" placeholder="Search by name or patient ID"><button>Search</button></form><p th:if="${param.created}" class="alert">Patient record created successfully.</p><div class="table-scroll"><table><thead><tr><th>Patient</th><th>Patient ID</th><th>Department</th><th>Blood group</th><th>Diagnosis</th><th>Status</th></tr></thead><tbody><tr th:each="p : ${patients}"><td><div class="patient-cell"><div class="avatar" th:text="${#strings.substring(p.fullName,0,1)}"></div><div><b th:text="${p.fullName}"></b><small th:text="${p.gender + ' · ' + p.phone}"></small></div></div></td><td th:text="${p.patientCode}"></td><td th:text="${p.department}"></td><td th:text="${p.bloodGroup}"></td><td th:text="${p.diagnosis}"></td><td><span class="badge" th:text="${p.status}"></span></td></tr></tbody></table></div></div></section></main></body></html>
