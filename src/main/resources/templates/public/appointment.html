<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title>Book Appointment | CareAxis</title></head><body class="public"><nav><a class="brand" href="/"><i class="fa-solid fa-heart-pulse"></i> CareAxis</a></nav><main class="booking"><p class="eyebrow">APPOINTMENT REQUEST</p><h1>Your care starts here.</h1><p th:if="${param.success}" class="alert">Your request has been received. Our care team will contact you shortly.</p><form th:action="@{/appointments}" th:object="${appointment}" method="post"><label>Full name<input th:field="*{patientName}" required></label><label>Department<select th:field="*{department}"><option>Cardiology</option><option>Neurology</option><option>Orthopedics</option><option>Pediatrics</option></select></label><label>Preferred doctor<input th:field="*{doctor}" placeholder="Optional"></label><label>Preferred date<input type="date" th:field="*{date}" required></label><label>Preferred time<input type="time" th:field="*{time}" required></label><button class="btn btn-primary">Request appointment</button></form></main></body></html>
