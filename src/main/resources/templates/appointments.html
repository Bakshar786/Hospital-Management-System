<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" th:href="@{/css/app.css}"><title>Appointments | CareAxis</title></head><body class="app"><div th:replace="~{fragments :: sidebar}"></div><main class="app-main"><div th:replace="~{fragments :: topbar}"></div><section class="content"><p class="eyebrow">SCHEDULING</p><h1>Appointments</h1><div class="card table-card"><table><thead><tr><th>Time</th><th>Patient</th><th>Doctor</th><th>Department</th><th>Status</th></tr></thead><tbody><tr th:each="a:${appointments}"><td th:text="${a.date+' '+a.time}"></td><td th:text="${a.patientName}"></td><td th:text="${a.doctor}"></td><td th:text="${a.department}"></td><td><span class="badge" th:text="${a.status}"></span></td></tr></tbody></table></div></section></main></body></html>
